[project]
name = "cncjs-pendant-python-bridge"
version = "1.1.0"
description = "Bridge a CNC pendant microcontroller to CNCjs via WebSocket"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
    "python-socketio<5.0",
    "python-engineio<4.0",
    "aiohttp>=3.8.0",
    "requests>=2.33.1",
]
